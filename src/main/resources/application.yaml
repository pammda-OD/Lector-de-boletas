ktor:
  deployment:
    host: "0.0.0.0"
    port: 8080
  application:
    modules:
      - com.RoutingKt.configureRouting
koog:
  google:
    apikey: "${?GOOGLE_API_KEY}"
    baseUrl: https://generativelanguage.googleapis.com

imap:
  host: "imap.gmail.com"
  port: 993
  username: "${?IMAP_USERNAME}"
  password: "${?IMAP_PASSWORD}"
  ssl: true
  searchDaysBack: 1
  searchDaysForward: 1
